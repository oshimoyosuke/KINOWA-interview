<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KINOWA Voices</title>
<style>
:root{
  --ink:#1B2521; --paper:#FBF9F4; --card:#FFFFFF; --line:#E9E5DB; --mute:#9AA39E;
  --accent:#00A878;
  --q1:#1F7A5C; --q2:#B5651D; --q3:#3B5C8A;
  --s5:#00A878; --s4:#4FBF97; --s3:#B9C2BD; --s2:#FF922B; --s1:#FA5252;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Yu Gothic","游ゴシック体",YuGothic,Arial,sans-serif;background:var(--paper);color:var(--ink);
  line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100dvh}
.wrap{max-width:520px;margin:0 auto;padding:0 18px 40px;display:flex;flex-direction:column;min-height:100dvh}

.top{padding:16px 0 10px}
.brand{font-family:Arial,sans-serif;font-size:.78rem;font-weight:700;letter-spacing:.14em;color:var(--accent)}
.pbar{height:4px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;width:0;transition:width .35s cubic-bezier(.4,0,.2,1)}

.stage{position:relative;flex:1;overflow:hidden}
.panel{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
  transition:transform .32s cubic-bezier(.4,0,.2,1),opacity .28s;opacity:0;transform:translateX(28px);pointer-events:none}
.panel.on{opacity:1;transform:none;pointer-events:auto;position:relative}
.panel.left{transform:translateX(-28px)}

.qbadge{display:inline-block;font-family:Arial,sans-serif;font-size:.7rem;font-weight:700;letter-spacing:.1em;
  color:#fff;padding:3px 11px;border-radius:99px}
.b1{background:var(--q1)} .b2{background:var(--q2)} .b3{background:var(--q3)}
.qt{font-size:1.26rem;font-weight:700;line-height:1.55;margin:12px 0 4px;letter-spacing:.01em}
.qs{font-size:.82rem;color:var(--mute)}

.choices{display:flex;flex-direction:column;gap:9px;margin-top:20px}
.ch{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);
  border-radius:18px;padding:11px 15px;cursor:pointer;font-family:inherit;text-align:left;width:100%;
  transition:border-color .18s,box-shadow .18s,transform .12s;position:relative;overflow:visible}
.ch:active{transform:scale(.985)}
.ch .om{width:46px;height:46px;flex:none;display:block}
.ch .lb{font-size:1rem;font-weight:700}
.ch .dot{margin-left:auto;width:11px;height:11px;border-radius:50%;background:var(--line);flex:none}
.ch.on{border-color:currentColor;box-shadow:0 0 0 1.5px currentColor}
.ch.on .dot{background:currentColor}
.ch.on .om{animation:wobble .5s ease}
@keyframes wobble{0%{transform:scale(1)}30%{transform:scale(1.18) rotate(-7deg)}60%{transform:scale(.96) rotate(4deg)}100%{transform:scale(1)}}
.burst{position:absolute;left:34px;top:50%;width:7px;height:7px;border-radius:50%;background:currentColor;
  pointer-events:none;animation:burst .55s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--bx),var(--by)) scale(.3)}}

.nav{display:flex;align-items:center;gap:12px;padding-top:22px}
.back{background:none;border:none;font-family:inherit;font-size:.88rem;font-weight:700;color:var(--mute);cursor:pointer;padding:8px 2px}
.dots{display:flex;gap:6px;margin:0 auto}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.next{background:var(--accent);color:#fff;border:none;border-radius:99px;font-family:inherit;font-size:.9rem;
  font-weight:700;padding:11px 26px;cursor:pointer}
.next:disabled{background:var(--line);color:var(--mute);cursor:not-allowed}

.msg{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:30px 22px;text-align:center;margin-top:26px}
.msg h2{font-size:1.24rem;font-weight:700;margin-bottom:8px}
.msg p{font-size:.9rem;color:var(--mute)}
.sum{display:flex;justify-content:center;gap:16px;margin:18px 0 4px}
.sum .it{text-align:center}
.sum .om{width:48px;height:48px;display:block;margin:0 auto}
.sum .cap{font-size:.7rem;color:var(--mute);margin-top:5px}

.foot{font-size:.74rem;color:var(--mute);line-height:1.75;padding-top:22px;border-top:1px solid var(--line);margin-top:26px}
.foot b{color:var(--ink)}
.attr{font-size:.68rem;color:var(--mute);margin-top:9px}
.attr a{color:var(--mute)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<script src="./config.js"></script>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">KINOWA VOICES</div>
    <div class="pbar"><i id="pbar"></i></div>
  </div>
  <div class="stage" id="stage"></div>
  <div class="foot" id="foot"></div>
</div>

const DEFAULT_GAS_URL='https://script.google.com/macros/s/AKfycbxMhh1XVTGVhOhlYEOFVU3jNxQ4lk4igP7Df3OKn0gjuW09qzavkr6LJcixTfoUUj6H/exec';
function getGasUrl(){try{const c=(window.KINOWA_CONFIG&&window.KINOWA_CONFIG.GAS_URL)||'';if(c)return c;}catch(_){}
try{const v=localStorage.getItem('kinowa_gas_url');return (v!=null&&v!=='')?v:DEFAULT_GAS_URL;}catch(_){return DEFAULT_GAS_URL;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* 設問定義（引き継ぎ資料 §2.2 の確定仕様） */
const QUESTIONS=[
 {id:'q1',badge:'Q1',cls:'b1',color:'var(--q1)',t:'この1か月、仕事に手応えはありましたか？',s:'いまの実感でお答えください',
  opts:[{v:5,e:'1F929',l:'つかめてきた'},{v:4,e:'1F60A',l:'まあまあ'},{v:3,e:'1F914',l:'まだ手探り'},
        {v:2,e:'1F635-200D-1F4AB',l:'精一杯'},{v:1,e:'1F61E',l:'手応えがない'}]},
 {id:'q2',badge:'Q2',cls:'b2',color:'var(--q2)',t:'この1か月、職場の人に相談しやすかったですか？',s:'相談できる相手がいるか、話しかけやすいか',
  opts:[{v:5,e:'1F604',l:'気軽に話せる'},{v:4,e:'1F642',l:'相談できる'},{v:3,e:'1F636',l:'相談していない'},
        {v:2,e:'1F614',l:'話しかけづらい'},{v:1,e:'1FAE5',l:'誰にも言えていない'}]},
 {id:'q3',badge:'Q3',cls:'b3',color:'var(--q3)',t:'この1か月、よく眠れていますか？',s:'睡眠の量と質をあわせて',
  opts:[{v:5,e:'1F634',l:'ぐっすり'},{v:4,e:'1F642',l:'だいたい眠れる'},{v:3,e:'1F971',l:'寝足りない'},
        {v:2,e:'1F616',l:'寝つけない'},{v:1,e:'1F480',l:'ほとんど眠れない'}]}
];
const SCORE_COLOR={5:'var(--s5)',4:'var(--s4)',3:'var(--s3)',2:'var(--s2)',1:'var(--s1)'};

const FOOT_NOTE='回答は<b>人事が確認します</b>。店長には点数ではなく、必要な場合のフォロー依頼として伝わります。';
const ATTR='絵文字：<a href="https://openmoji.org" target="_blank" rel="noopener">OpenMoji</a>（CC BY-SA 4.0）を改変して使用';

let token='',info=null,step=0;
const ans={q1:'',q2:'',q3:''};

function start(){
  token=new URLSearchParams(location.search).get('t')||'';
  document.getElementById('foot').innerHTML=FOOT_NOTE+'<div class="attr">'+ATTR+'</div>';
  if(!token){showMsg('リンクが正しくありません','メールに記載されたリンクから開いてください。');return;}
  fetch(getGasUrl()+'?t='+encodeURIComponent(token)).then(r=>r.json()).then(res=>{
    if(!res||!res.ok){showMsg('リンクが無効です','有効期限切れか、リンクが正しくない可能性があります。人事までご連絡ください。');return;}
    info=res;
    if(res.answered){showMsg('回答は受け付け済みです','今回分のご回答をいただいています。ありがとうございました。');return;}
    render();
  }).catch(()=>showMsg('通信エラー','時間をおいて、もう一度お試しください。'));
}

function roundLabel(r){const s=String(r||'');return /^\d{1,2}$/.test(s)?('入社'+(+s)+'か月'):s;}

function render(){
  const stage=document.getElementById('stage');
  const q=QUESTIONS[step];
  const total=QUESTIONS.length;
  document.getElementById('pbar').style.width=((step)/total*100)+'%';
  stage.innerHTML=`<div class="panel on" style="color:${q.color}">
    <div><span class="qbadge ${q.cls}">${q.badge}</span></div>
    <div class="qt">${esc(q.t)}</div><div class="qs">${esc(q.s)}</div>
    <div class="choices">${q.opts.map((o,i)=>`
      <button class="ch ${ans[q.id]==o.v?'on':''}" style="color:${SCORE_COLOR[o.v]}" onclick="choose('${q.id}',${o.v},this)">
        ${EMOJI[o.e]||''}<span class="lb">${esc(o.l)}</span><span class="dot"></span>
      </button>`).join('')}</div>
    <div class="nav">
      ${step>0?'<button class="back" onclick="go(-1)">← 戻る</button>':'<span style="width:60px"></span>'}
      <div class="dots">${QUESTIONS.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>
      <button class="next" id="next" ${ans[q.id]?'':'disabled'} onclick="go(1)">${step===total-1?'送信':'次へ'}</button>
    </div></div>`;
}

function choose(id,v,el){
  ans[id]=v;
  try{if(navigator.vibrate)navigator.vibrate(12);}catch(_){}
  el.parentNode.querySelectorAll('.ch').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  for(let i=0;i<7;i++){
    const p=document.createElement('span');p.className='burst';
    const a=Math.PI*2*i/7;
    p.style.setProperty('--bx',(Math.cos(a)*34).toFixed(0)+'px');
    p.style.setProperty('--by',(Math.sin(a)*34).toFixed(0)+'px');
    el.appendChild(p);setTimeout(()=>p.remove(),600);
  }
  const n=document.getElementById('next');if(n)n.disabled=false;
  setTimeout(()=>{if(step<QUESTIONS.length-1){go(1);}},380);
}

function go(d){
  if(d>0&&!ans[QUESTIONS[step].id])return;
  if(d>0&&step===QUESTIONS.length-1){submitAnswer();return;}
  step=Math.max(0,Math.min(QUESTIONS.length-1,step+d));
  render();window.scrollTo(0,0);
}

function submitAnswer(){
  const n=document.getElementById('next');if(n){n.disabled=true;n.textContent='送信中…';}
  document.getElementById('pbar').style.width='100%';
  fetch(getGasUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({kind:'pulse',action:'answer',token:token,answers:ans})})
    .then(r=>r.json()).then(res=>{
      if(res&&res.ok){showDone();}
      else{if(n){n.disabled=false;n.textContent='送信';}alert('送信に失敗しました。時間をおいてお試しください。');}
    }).catch(e=>{if(n){n.disabled=false;n.textContent='送信';}alert('通信エラー：'+e);});
}

function showDone(){
  const sum=QUESTIONS.map(q=>{const o=q.opts.find(x=>x.v==ans[q.id]);
    return `<div class="it">${EMOJI[o.e]||''}<div class="cap">${esc(o.l)}</div></div>`;}).join('');
  document.getElementById('stage').innerHTML=`<div class="panel on"><div class="msg">
    <h2>ありがとうございました</h2>
    <p>${esc(info&&info.name?info.name+' さんの回答を受け付けました。':'回答を受け付けました。')}</p>
    <div class="sum">${sum}</div>
  </div></div>`;
  window.scrollTo(0,0);
}

function showMsg(t,p){
  document.getElementById('stage').innerHTML=
   `<div class="panel on"><div class="msg"><h2>${esc(t)}</h2><p>${esc(p)}</p></div></div>`;
  document.getElementById('pbar').style.width='0%';
}
start();
</script>
</body>
</html>
